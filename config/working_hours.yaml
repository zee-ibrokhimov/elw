# Стартовое рабочее расписание. Загружается в таблицы working_hours и
# schedule_exceptions при первом запуске, дальше правится командами /hours
# и /vacation в боте — менять отпуск пересборкой образа неудобно.
#
# Время локальное, в поясе из OWNER_TZ (по умолчанию Europe/Rome).
# Дни: mon, tue, wed, thu, fri, sat, sun.

working_hours:
  mon:
    - ["09:00", "13:00"]
    - ["15:00", "20:00"]
  tue:
    - ["09:00", "13:00"]
    - ["15:00", "20:00"]
  wed:
    - ["09:00", "13:00"]
    - ["15:00", "20:00"]
  thu:
    - ["09:00", "13:00"]
    - ["15:00", "20:00"]
  fri:
    - ["09:00", "13:00"]
    - ["15:00", "18:00"]
  sat:
    - ["10:00", "14:00"]
  sun: []

# Отпуска и разовые исключения.
#   kind: closed — не работаем; extra — дополнительное окно сверх обычных часов.
exceptions: []
  # - kind: closed
  #   from: 2026-08-10
  #   to: 2026-08-24
  #   note: отпуск
  # - kind: extra
  #   from: 2026-09-05
  #   to: 2026-09-05
  #   start: "20:00"
  #   end: "22:00"
  #   note: перенос с четверга
