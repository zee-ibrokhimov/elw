[project]
name = "tutorsync"
version = "0.1.0"
description = "Синхронизация расписания репетитора: Preply (email) ↔ Google Calendar ↔ Telegram-бот"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
    "apscheduler>=3.10,<4",
    "imap-tools>=1.7",
    "structlog>=24.4",
    "cryptography>=43.0",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    # zoneinfo без системной базы (Windows, slim-образы) берёт данные отсюда
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
tutorsync = "tutorsync.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Тесты, которым нужен настоящий Postgres: EXCLUDE-констрейнты на SQLite
    # не воспроизводятся, проверять их на SQLite = проверять не то, что поедет в прод.
    "postgres: требует POSTGRES_TEST_DSN",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "DTZ", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["tutorsync"]
strict_optional = true
warn_unused_ignores = true
