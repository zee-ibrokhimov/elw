[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# sqlalchemy.url намеренно не задан: адрес базы приходит из DATABASE_URL,
# см. migrations/env.py. Держать строку подключения в файле репозитория нельзя.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
